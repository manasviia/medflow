name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint + format (fast, no heavy deps) ────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tools
        run: pip install "ruff>=0.4.0" "black>=24.0.0"

      - name: Lint with ruff
        run: ruff check medflow/ tests/ scripts/

      - name: Format check with black
        run: black --check medflow/ tests/ scripts/

  # ── Job 2: Unit + integration tests (runs after lint) ────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm loguru numpy Pillow scikit-learn mlflow pandas \
                      fastapi pydantic pytest pytest-cov

      - name: Run unit tests
        run: PYTHONPATH=$GITHUB_WORKSPACE pytest tests/unit/ -v --cov=medflow --cov-report=xml

      - name: Run integration tests
        run: PYTHONPATH=$GITHUB_WORKSPACE pytest tests/integration/ -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  # ── Job 3: Docker build (runs after tests pass) ───────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false        # Build only — push on release tags
          tags: medflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
